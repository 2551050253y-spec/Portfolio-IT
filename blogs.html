<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - SinanTokmak</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dist/output.css">
</head>
<body class="dark font-sans relative">

    <header class="site-header flex justify-between items-center">
       <div class="site-logo">
           <a href="index.html" class="nav-link"><span>&lt;C/&gt;</span> SinanTokmak</a>
       </div>

       <nav class="hidden lg:flex gap-8">
           <a href="index.html#home" class="nav-link">Home</a>
           <a href="index.html#about" class="nav-link">About</a>
           <a href="index.html#skills" class="nav-link">Skills</a>
           <a href="index.html#works" class="nav-link">Works</a>
           <a href="blogs.html" class="nav-link active">Blogs</a>
           <a href="index.html#contact" class="nav-link">Contact</a>
       </nav>

       <div class="flex gap-4 items-center">
           <button type="button" class="theme-toggle p-2" aria-label="Theme"><i class="fa-solid fa-sun text-[#26D9B5]"></i></button>
           <a href="index.html" class="btn-primary text-xs">← Về trang chủ</a>
       </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 mt-12">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-[#26D9B5] font-mono mb-2">&lt;All Blogs/&gt;</h1>
            <p class="text-gray-400 text-xs font-mono">Chia sẻ kiến thức lập trình, cấu trúc dữ liệu và tối ưu hóa hệ thống web.</p>
        </header>

        <div class="bg-[#2C3137] rounded-2xl p-6 mb-8 border border-gray-700">
            <div class="search-input-wrapper mb-4">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="blog-search-input" class="form-input" placeholder="Tìm kiếm bài viết theo từ khóa..." autocomplete="off">
            </div>

            <div class="flex gap-2 flex-wrap" id="category-filters">
                <button type="button" class="filter-btn active" data-category="all">Tất cả</button>
                <button type="button" class="filter-btn" data-category="Frontend">Frontend</button>
                <button type="button" class="filter-btn" data-category="Performance">Performance</button>
                <button type="button" class="filter-btn" data-category="Accessibility">Accessibility</button>
                <button type="button" class="filter-btn" data-category="Programming">C++</button>
                <button type="button" class="filter-btn" data-category="Career">Career</button>
            </div>
        </div>

        <div id="blogs-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8"></div>
        <div id="pagination-controls" class="flex justify-center gap-2 pb-16 font-mono"></div>
    </main>

    <footer class="border-t border-gray-800 py-6 text-center text-xs font-mono text-gray-400">
        <p>© 2026 SinanTokmak. Đề tài 11 - Bài tập lớn Thiết kế Web.</p>
    </footer>

    <script src="js/javas.js"></script>
    <script src="js/blogs.js"></script>
</body>
</html>
