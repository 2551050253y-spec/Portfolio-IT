<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Bài viết kỹ thuật của Nhựt Nam." />
    <title>Blogs — Nhựt Nam</title>
    <link rel="stylesheet" href="css/components.css" />
    <style>
      .filters {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 2rem 0;
      }
      .filter {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
      }
      .filter.active {
        background: var(--accent);
        color: #08252a;
        border-color: var(--accent);
      }
      .blog-list {
        display: grid;
        gap: 1rem;
        padding: 3rem 0;
      }
      .post {
        padding: 1.5rem;
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 1.5rem;
      }
      .post h2 {
        margin: 0;
        font-size: 1.45rem;
      }
      .post p {
        color: var(--muted);
      }
      .post a {
        color: var(--text);
        text-decoration: none;
      }
      .post a:hover {
        color: var(--accent);
      }
      .meta {
        font: 0.72rem var(--mono);
        color: var(--accent);
      }
      .pagination {
        display: flex;
        gap: 0.5rem;
      }
      .pagination button {
        min-width: 38px;
        padding: 0.45rem;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
      }
      .pagination .active {
        background: var(--accent);
        color: #08252a;
      }
      @media (max-width: 600px) {
        .post {
          grid-template-columns: 1fr;
          gap: 0.6rem;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <header class="shell site-header">
      <a class="brand" href="index.html"
        ><span class="brand-mark">N</span>NHỰT NAM</a
      ><button class="menu-button" data-menu-button aria-expanded="false">
        ☰
      </button>
      <nav class="site-nav" data-menu>
        <a href="index.html">Trang chủ</a><a href="projects.html">Dự án</a
        ><a href="blogs.html" aria-current="page">Blogs</a
        ><a href="resume.html">Resume</a
        ><button
          class="icon-button"
          data-theme-toggle
          aria-label="Đổi giao diện"
        >
          ◐
        </button>
      </nav>
    </header>
    <main id="main">
      <section class="shell page-hero">
        <p class="eyebrow">Writing / Notes</p>
        <h1>Learn, build,<br />share.</h1>
        <p>
          Ghi chép ngắn về những điều mình học được khi xây dựng sản phẩm web.
        </p>
      </section>
      <section class="shell">
        <div class="filters" id="filters" aria-label="Lọc bài viết"></div>
        <div id="blog-list" class="blog-list" aria-live="polite"></div>
        <nav id="pagination" class="pagination" aria-label="Phân trang"></nav>
      </section>
    </main>
    <footer class="shell footer">
      <span>© 2026 Nhựt Nam</span><a href="index.html">Về trang chủ</a>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/blogs.js"></script>
  </body>
</html>
