<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách bài viết - DevPortfolio</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="background-color: var(--bg-body); color: var(--text-primary); font-family: var(--font-family); margin: 0; padding: 0 40px;">
  
  <header style="padding: 20px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
    <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;"><strong>DevPortfolio.</strong></a></div>
    <nav>
      <a href="index.html" style="margin-right: 15px; color: inherit; text-decoration: none;">Trang chủ</a>
      <a href="blogs.html" style="margin-right: 15px; color: var(--primary-accent); text-decoration: none; font-weight: bold;">Blogs</a>
    </nav>
  </header>

  <main style="max-width: 900px; margin: 40px auto;">
    <h1>Tất cả bài viết</h1>
    
    <!-- Bộ lọc danh mục -->
    <div id="filter-container" style="margin: 20px 0; display: flex; gap: 10px;">
      <button class="filter-btn active" data-category="all" style="padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); cursor: pointer;">Tất cả</button>
      <button class="filter-btn" data-category="Performance" style="padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); cursor: pointer;">Performance</button>
      <button class="filter-btn" data-category="Frontend" style="padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); cursor: pointer;">Frontend</button>
      <button class="filter-btn" data-category="Accessibility" style="padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); cursor: pointer;">Accessibility</button>
    </div>

    <!-- Danh sách render động -->
    <div id="blog-list" style="display: grid; gap: 20px; margin-top: 30px;"></div>
  </main>

  <script src="js/blogs.js"></script>
</body>
</html>
