<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Case study dự án của Nhựt Nam." />
    <title>Case study — Nhựt Nam</title>
    <link rel="stylesheet" href="css/components.css" />
    <style>
      .case {
        max-width: 820px;
        padding: 5rem 0;
      }
      .case h1 {
        font-size: clamp(2.8rem, 7vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }
      .case p {
        max-width: 680px;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .case-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin: 3rem 0;
      }
      .case-grid div {
        padding: 1rem;
        border: 1px solid var(--line);
      }
      .case-grid b {
        display: block;
        color: var(--accent);
        font: 0.72rem var(--mono);
      }
      @media (max-width: 600px) {
        .case-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="shell site-header">
      <a class="brand" href="index.html"
        ><span class="brand-mark">N</span>NHỰT NAM</a
      >
      <nav class="site-nav">
        <a href="projects.html">← Dự án</a
        ><button class="icon-button" data-theme-toggle>◐</button>
      </nav>
    </header>
    <main class="shell case" id="case"></main>
    <footer class="shell footer"><span>© 2026 Nhựt Nam</span></footer>
    <script src="js/main.js"></script>
    <script>
      const p = {
        portfolio: [
          "Developer Portfolio",
          "Một portfolio bám sát Figma, tối ưu cho bốn kích thước màn hình và các thao tác có thể khám phá.",
          "HTML / CSS / JavaScript",
        ],
        "data-manager": [
          "Data Manager",
          "Ứng dụng console luyện tập tư duy cấu trúc dữ liệu, hướng đối tượng và tìm kiếm.",
          "C++ / Algorithms",
        ],
        a11y: [
          "A11y Components",
          "Một sandbox nhỏ để kiểm tra focus, modal, thông báo lỗi và các luồng bàn phím.",
          "JavaScript / WCAG",
        ],
      };
      let d = p[new URLSearchParams(location.search).get("id")] || p.portfolio;
      document.title = d[0] + " — Nhựt Nam";
      document.querySelector("#case").innerHTML =
        `<p class="eyebrow">Case study / 2026</p><h1>${d[0]}</h1><p>${d[1]}</p><div class="case-grid"><div><b>VAI TRÒ</b>Thiết kế & phát triển</div><div><b>STACK</b>${d[2]}</div><div><b>ƯU TIÊN</b>Responsive · A11y</div></div><h2>Hướng thực hiện</h2><p>Mình bắt đầu bằng việc tách cấu trúc nội dung, hệ token giao diện và các trạng thái tương tác. Điều đó giúp từng phần dễ kiểm thử và nhất quán khi mở rộng.</p>`;
    </script>
  </body>
</html>
