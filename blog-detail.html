<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Bài viết kỹ thuật của Nhựt Nam." />
    <title>Bài viết — Nhựt Nam</title>
    <link rel="stylesheet" href="css/components.css" />
    <style>
      .article {
        max-width: 760px;
        padding: 4rem 0 7rem;
      }
      .article h1 {
        font-size: clamp(2.5rem, 6vw, 5rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }
      .article .meta {
        color: var(--muted);
        font: 0.75rem var(--mono);
      }
      .article p {
        font-size: 1.05rem;
        color: var(--muted);
      }
      .article h2 {
        margin-top: 2.8rem;
      }
      .back {
        color: var(--accent);
        font: 0.8rem var(--mono);
      }

  <body>
    <header class="shell site-header">
      <a class="brand" href="index.html"

        ><button
          class="icon-button"
          data-theme-toggle
          aria-label="Đổi giao diện"
        >
          ◐
        </button>
      </nav>
    </header>
    <main class="shell article" id="article" aria-live="polite">
      <p>Đang tải bài viết...</p>
    </main>
    <footer class="shell footer"><span>© 2026 Nhựt Nam</span></footer>
    <script src="js/main.js"></script>
